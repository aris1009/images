# Recommended minimum access policy, from upstream squid.conf.default.
# Deny-only guards: nothing here grants access. Add your own allow rules in a
# higher-numbered file in this directory, e.g. 20-policy.conf.
#
# These rules run first. To proxy a port other than 80/443, widen Safe_ports
# (and SSL_ports for CONNECT) in your own file.

acl SSL_ports port 443
acl Safe_ports port 80 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny to_linklocal
