# Default configuration for ghcr.io/aris1009/squid-hardened.
#
# This file is a safe starting point, not a policy: it denies every request.
# The deployer supplies the policy, either by mounting a replacement at
# /etc/squid/squid.conf or by mounting .conf files into /etc/squid/conf.d/.
# Nothing here is specific to any deployment.

http_port 3128

# This is a forward proxy, not a member of a cache hierarchy.
icp_port 0

# Container-friendly runtime state. Logs go to the runtime's stdout/stderr and
# no cache_dir is configured, so caching is memory-only until the deployer adds
# one on a writable volume (see README.md).
#
# Connections from 127.0.0.1 are the health probe opening a TCP connection to
# prove the listener accepts. They are filtered out of the access log so a
# 30-second check does not fill it with `transaction-end-before-headers`.
acl healthcheck src 127.0.0.1
access_log stdio:/dev/stdout squid !healthcheck
cache_log stdio:/dev/stderr
logfile_rotate 0
buffered_logs on
pid_filename /tmp/squid.pid
coredump_dir /tmp
visible_hostname squid
shutdown_lifetime 5 seconds

# If the container is started as root anyway, drop to the shipped unprivileged
# user. Running as uid 1000 (the image default) makes this a no-op.
cache_effective_user squid

# Do not forward the client address upstream. Squid's own `Via` header is left
# at its default: turning it off draws a startup warning because HTTP/1.1
# expects it. Add `via off` if your threat model wants it gone.
forwarded_for delete

# Deployer policy. Included before the final deny, so allow rules mounted here
# are evaluated first. The image ships conf.d/10-recommended.conf, the
# deny-only guards upstream recommends; files you add with a higher number are
# read after it.
include /etc/squid/conf.d/*.conf

# Deny everything that was not explicitly allowed above.
http_access deny all
